[package]
name = "envaudit"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["hix-pro"]
description = "Audit environment variable usage, documentation, and secrets in a repository."
repository = "https://github.com/hix-pro/env-audit"
homepage = "https://github.com/hix-pro/env-audit"
readme = "README.md"
license = "MIT"
keywords = ["environment", "env", "secrets", "dotenv", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
strip = true
