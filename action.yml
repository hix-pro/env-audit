name: EnvAudit
description: >-
  Audit environment variable usage, documentation, and secrets in your
  repository. Local-first: nothing leaves the runner.
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    required: false
    default: '.'
  fail-on:
    description: >-
      Exit 2 when matching findings exist: any, missing, or secret.
      Leave empty for report-only mode.
    required: false
    default: ''
  args:
    description: Extra arguments passed through to `envaudit scan` (e.g. `--markdown`).
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Prefers the prebuilt binary attached to the release matching the action
    # ref (e.g. @v0.3.1). Anything else — a branch or SHA ref, `uses: ./`,
    # an unsupported platform, or a release without binaries — falls back to
    # building from source below.
    - name: Try prebuilt binary
      id: prebuilt
      shell: bash
      continue-on-error: true
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -euo pipefail
        case "$ACTION_REF" in
          refs/tags/v[0-9]*) tag="${ACTION_REF#refs/tags/}" ;;
          v[0-9]*) tag="$ACTION_REF" ;;
          *)
            echo "action ref '$ACTION_REF' is not a version tag; building from source"
            exit 1
            ;;
        esac
        os="$(uname -s)"
        arch="$(uname -m)"
        windows=false
        case "$os" in
          Linux)
            target="x86_64-unknown-linux-gnu"
            ;;
          Darwin)
            if [[ "$arch" == "arm64" ]]; then
              target="aarch64-apple-darwin"
            else
              target="x86_64-apple-darwin"
            fi
            ;;
          MINGW*|MSYS*|CYGWIN*)
            target="x86_64-pc-windows-msvc"
            windows=true
            ;;
          *)
            echo "unsupported platform ($os/$arch); building from source"
            exit 1
            ;;
        esac
        suffix=""
        if [[ "$windows" == "true" ]]; then
          suffix=".exe"
        fi
        asset="envaudit-${target}.tar.gz"
        url="https://github.com/${ACTION_REPO}/releases/download/${tag}/${asset}"
        tmp="$(mktemp -d)"
        echo "downloading $url"
        curl -fsSL "$url" -o "$tmp/$asset"
        tar -xzf "$tmp/$asset" -C "$tmp"
        bin_dir="$RUNNER_TEMP/hix-bin"
        if command -v cygpath >/dev/null 2>&1; then
          bin_dir="$(cygpath -u "$RUNNER_TEMP")/hix-bin"
        fi
        mkdir -p "$bin_dir"
        install "$tmp/envaudit-${target}/envaudit${suffix}" "$bin_dir/"
        "$bin_dir/envaudit${suffix}" --version
        echo "$bin_dir" >> "$GITHUB_PATH"
        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "installed prebuilt binary for $target"

    - name: Install Rust toolchain
      if: ${{ steps.prebuilt.outputs.found != 'true' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Install EnvAudit from source
      if: ${{ steps.prebuilt.outputs.found != 'true' }}
      shell: bash
      run: cargo install --locked --path "$GITHUB_ACTION_PATH"

    - name: Run EnvAudit
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        EXTRA_ARGS: ${{ inputs.args }}
      run: |
        args=()
        if [[ -n "$FAIL_ON" ]]; then
          args+=(--fail-on "$FAIL_ON")
        fi
        # EXTRA_ARGS is deliberately word-split so callers can pass several flags.
        # shellcheck disable=SC2086
        exec envaudit scan "$SCAN_PATH" "${args[@]}" $EXTRA_ARGS
